version: '3.8'

services:
  # 추천 API 서버 (기존 Dockerfile.recommendation-api 사용)
  recommendation-api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.recommendation-api
    environment:
      - FIREBASE_CONFIG_PATH=/app/csproject2025-cfcb7-firebase-adminsdk-fbsvc-6764c4a1fb.json
    volumes:
      - ./csproject2025-cfcb7-firebase-adminsdk-fbsvc-6764c4a1fb.json:/app/csproject2025-cfcb7-firebase-adminsdk-fbsvc-6764c4a1fb.json:ro
    ports:
      - "5001:5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 스케줄러 서비스 (기존 Dockerfile.scheduler 사용)
  scheduler:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.scheduler
    environment:
      - FIREBASE_CONFIG_PATH=/app/csproject2025-cfcb7-firebase-adminsdk-fbsvc-6764c4a1fb.json
      - GEMINI_API_KEY=AIzaSyD1hxIJlbglSksUxRyLZkMZHrWyqFEwpEs
      - NAVER_CLIENT_ID=RPUhkWY7UVq81hlMiHNL
      - NAVER_CLIENT_SECRET=u5HUugAYuv
    volumes:
      # Firebase 설정 파일 마운트
      - ${PWD}/csproject2025-cfcb7-firebase-adminsdk-fbsvc-6764c4a1fb.json:/app/csproject2025-cfcb7-firebase-adminsdk-fbsvc-6764c4a1fb.json:ro
      # Docker 소켓 마운트 (파이프라인에서 다른 컨테이너 실행용)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 스크립트 파일들 마운트
      - ${PWD}/scheduler:/app/scheduler:ro
      # Dockerfile들과 소스코드도 마운트 (빌드용)
      - ${PWD}/dockerfiles:/app/dockerfiles:ro
      - ${PWD}/trend-collector:/app/trend-collector:ro
      - ${PWD}/trend-analyzer:/app/trend-analyzer:ro
      - ${PWD}/library-searcher:/app/library-searcher:ro
      - ${PWD}/requirements.txt:/app/requirements.txt:ro
    restart: unless-stopped
    depends_on:
      - recommendation-api

  # # 웹 UI (기존 Dockerfile.web-ui 사용)
  # web-ui:
  #   environment:
  #   - API_URL=http://recommendation-api:5001
  #   build:
  #     context: .
  #     dockerfile: dockerfiles/Dockerfile.web-ui
  #   ports:
  #     - "3001:80"
  #   restart: unless-stopped
  #   depends_on:
  #     - recommendation-api
  
  keyword-collector:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.keyword-collector
    image: cs-project-2025-keyword-collector
    profiles: ["pipeline"]  # 기본 실행에서 제외

  news-collector:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.news-collector
    image: cs-project-2025-news-collector
    profiles: ["pipeline"]

  trend-analyzer:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.trend-analyzer
    image: cs-project-2025-trend-analyzer
    profiles: ["pipeline"]

  library-searcher:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.library-searcher
    image: cs-project-2025-library-searcher
    profiles: ["pipeline"]

networks:
  default:
    name: cs-project-network